<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gratitude Journal</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #1f2937;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
      border: 1px solid rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(8px);
    }
    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }
    @media (max-width: 600px) {
      .home-link {
        top: 10px;
        left: 10px;
        padding: 8px 11px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>
  <a class="home-link" href="../" aria-label="Back to home page">← Home</a>

  <main class="journal-card">
    <section class="header">
      <p class="eyebrow">Daily Reflection</p>
      <h1>Gratitude Journal</h1>
      <p class="instructions">Take a quiet moment to write down something you are grateful for today.</p>
    </section>

    <section class="entry-form" aria-label="Gratitude journal entry form">
      <label for="gratitudeInput">Today I am grateful for...</label>
      <textarea id="gratitudeInput" rows="5" placeholder="Example: a kind conversation, a warm meal, a peaceful moment..."></textarea>
      <button id="saveButton" type="button">Save entry</button>
      <p id="saveMessage" class="save-message" aria-live="polite"></p>
    </section>

    <section class="entries-section" aria-label="Saved gratitude entries">
      <div class="entries-header">
        <h2>Past entries</h2>
        <button id="clearButton" class="secondary-button" type="button">Clear all</button>
      </div>
      <div id="entriesList" class="entries-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
