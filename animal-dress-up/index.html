<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Dress-Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="home-link" href="../">← Home</a>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Creative Play</p>
      <h1>Animal Dress-Up</h1>
      <p>Choose a cuddly animal and mix and match cute clothes and accessories.</p>
    </header>

    <section class="layout">
      <aside class="controls" aria-label="Dress-up controls">
        <div class="control-group">
          <h2>Choose an animal</h2>
          <div class="choice-row animal-choices">
            <button class="choice active" data-animal="capybara" type="button">Capybara</button>
            <button class="choice" data-animal="panda" type="button">Panda</button>
          </div>
        </div>

        <div class="control-group"><h2>Hat</h2><div class="choice-row">
          <button class="item active" data-category="hat" data-item="none" type="button">None</button>
          <button class="item" data-category="hat" data-item="sun" type="button">Sun hat</button>
          <button class="item" data-category="hat" data-item="party" type="button">Party hat</button>
        </div></div>

        <div class="control-group"><h2>Top</h2><div class="choice-row">
          <button class="item active" data-category="top" data-item="none" type="button">None</button>
          <button class="item" data-category="top" data-item="shirt" type="button">T-shirt</button>
          <button class="item" data-category="top" data-item="scarf" type="button">Scarf</button>
        </div></div>

        <div class="control-group"><h2>Bottom</h2><div class="choice-row">
          <button class="item active" data-category="bottom" data-item="none" type="button">None</button>
          <button class="item" data-category="bottom" data-item="shorts" type="button">Shorts</button>
        </div></div>

        <div class="control-group"><h2>Accessories</h2><div class="choice-row">
          <button class="item active" data-category="accessory" data-item="none" type="button">None</button>
          <button class="item" data-category="accessory" data-item="purse" type="button">Purse</button>
        </div></div>

        <div class="control-group"><h2>Shoes</h2><div class="choice-row">
          <button class="item active" data-category="shoes" data-item="none" type="button">None</button>
          <button class="item" data-category="shoes" data-item="sneakers" type="button">Sneakers</button>
        </div></div>

        <div class="actions">
          <button id="randomButton" type="button">Surprise me</button>
          <button id="resetButton" type="button">Reset outfit</button>
        </div>
      </aside>

      <section class="stage-panel">
        <div class="stage" aria-live="polite">
          <svg id="character" viewBox="0 0 600 650" role="img" aria-label="Dressed-up animal">
            <defs>
              <linearGradient id="capyBody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a58"/><stop offset="1" stop-color="#a96334"/></linearGradient>
              <linearGradient id="capyFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ad6c"/><stop offset="1" stop-color="#bb7440"/></linearGradient>
              <linearGradient id="pandaWhite" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#dedbd2"/></linearGradient>
              <linearGradient id="pandaBlack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#403b38"/><stop offset="1" stop-color="#171514"/></linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#5a4030" flood-opacity=".22"/></filter>
            </defs>

            <ellipse cx="300" cy="590" rx="150" ry="28" fill="#cfc4bc" opacity=".55"/>

            <g id="capybara" class="animal" filter="url(#softShadow)">
              <ellipse cx="300" cy="380" rx="137" ry="176" fill="url(#capyBody)" stroke="#4a2b1b" stroke-width="9"/>
              <ellipse cx="300" cy="210" rx="145" ry="132" fill="url(#capyFace)" stroke="#4a2b1b" stroke-width="9"/>
              <ellipse cx="185" cy="112" rx="42" ry="35" fill="#bf7742" stroke="#4a2b1b" stroke-width="9" transform="rotate(-18 185 112)"/>
              <ellipse cx="415" cy="112" rx="42" ry="35" fill="#bf7742" stroke="#4a2b1b" stroke-width="9" transform="rotate(18 415 112)"/>
              <ellipse cx="213" cy="208" rx="13" ry="19" fill="#2d1c14"/>
              <ellipse cx="387" cy="208" rx="13" ry="19" fill="#2d1c14"/>
              <ellipse cx="300" cy="255" rx="54" ry="40" fill="#a86035" opacity=".9"/>
              <ellipse cx="300" cy="245" rx="25" ry="17" fill="#3a2117"/>
              <path d="M272 274 Q300 300 328 274" fill="none" stroke="#3a2117" stroke-width="8" stroke-linecap="round"/>
              <ellipse cx="168" cy="386" rx="31" ry="98" fill="#b86f3c" stroke="#4a2b1b" stroke-width="8" transform="rotate(6 168 386)"/>
              <ellipse cx="432" cy="386" rx="31" ry="98" fill="#b86f3c" stroke="#4a2b1b" stroke-width="8" transform="rotate(-6 432 386)"/>
              <rect x="205" y="485" width="73" height="104" rx="31" fill="#9b592f" stroke="#4a2b1b" stroke-width="8"/>
              <rect x="322" y="485" width="73" height="104" rx="31" fill="#9b592f" stroke="#4a2b1b" stroke-width="8"/>
              <path d="M187 162 Q220 130 255 142" fill="none" stroke="#f3c48f" stroke-width="12" stroke-linecap="round" opacity=".5"/>
            </g>

            <g id="panda" class="animal hidden" filter="url(#softShadow)">
              <ellipse cx="300" cy="380" rx="135" ry="176" fill="url(#pandaWhite)" stroke="#292523" stroke-width="9"/>
              <circle cx="205" cy="112" r="48" fill="url(#pandaBlack)" stroke="#292523" stroke-width="9"/>
              <circle cx="395" cy="112" r="48" fill="url(#pandaBlack)" stroke="#292523" stroke-width="9"/>
              <ellipse cx="300" cy="210" rx="143" ry="134" fill="url(#pandaWhite)" stroke="#292523" stroke-width="9"/>
              <ellipse cx="230" cy="210" rx="44" ry="56" fill="url(#pandaBlack)" transform="rotate(19 230 210)"/>
              <ellipse cx="370" cy="210" rx="44" ry="56" fill="url(#pandaBlack)" transform="rotate(-19 370 210)"/>
              <circle cx="230" cy="211" r="11" fill="#fff"/><circle cx="370" cy="211" r="11" fill="#fff"/>
              <circle cx="233" cy="214" r="6" fill="#171514"/><circle cx="367" cy="214" r="6" fill="#171514"/>
              <ellipse cx="300" cy="258" rx="27" ry="20" fill="#24201e"/>
              <path d="M272 280 Q300 304 328 280" fill="none" stroke="#24201e" stroke-width="8" stroke-linecap="round"/>
              <ellipse cx="166" cy="386" rx="33" ry="102" fill="url(#pandaBlack)" stroke="#292523" stroke-width="8" transform="rotate(6 166 386)"/>
              <ellipse cx="434" cy="386" rx="33" ry="102" fill="url(#pandaBlack)" stroke="#292523" stroke-width="8" transform="rotate(-6 434 386)"/>
              <rect x="205" y="484" width="73" height="105" rx="31" fill="url(#pandaBlack)" stroke="#292523" stroke-width="8"/>
              <rect x="322" y="484" width="73" height="105" rx="31" fill="url(#pandaBlack)" stroke="#292523" stroke-width="8"/>
              <path d="M215 156 Q255 130 290 142" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".62"/>
            </g>

            <g id="capybara-wearables" class="wearable-set">
              <g data-category="hat" data-item="sun" class="wearable hidden"><ellipse cx="300" cy="102" rx="151" ry="28" fill="#f8d878" stroke="#6d4b20" stroke-width="8"/><path d="M210 100 Q225 28 300 28 Q375 28 390 100Z" fill="#ffe69b" stroke="#6d4b20" stroke-width="8"/><path d="M225 66 Q300 90 375 66" fill="none" stroke="#e77d91" stroke-width="15"/></g>
              <g data-category="hat" data-item="party" class="wearable hidden"><path d="M230 116 L300 17 L370 116Z" fill="#9d83e8" stroke="#4b3d78" stroke-width="8"/><circle cx="300" cy="17" r="16" fill="#ffd468"/><circle cx="275" cy="69" r="9" fill="#ff91a5"/><circle cx="326" cy="82" r="9" fill="#77c9c3"/></g>
              <g data-category="top" data-item="shirt" class="wearable hidden"><path d="M174 319 Q196 286 235 282 L300 311 L365 282 Q404 286 426 319 L398 463 Q300 495 202 463Z" fill="#78bfe9" stroke="#315b75" stroke-width="8"/><path d="M258 294 Q300 331 342 294" fill="none" stroke="#315b75" stroke-width="8"/></g>
              <g data-category="top" data-item="scarf" class="wearable hidden"><path d="M175 304 Q300 365 425 304 L407 357 Q300 390 193 357Z" fill="#ef8093" stroke="#7f3948" stroke-width="8"/><path d="M350 348 L408 500 L350 480 L312 373Z" fill="#ef8093" stroke="#7f3948" stroke-width="8"/></g>
              <g data-category="bottom" data-item="shorts" class="wearable hidden"><path d="M195 442 Q300 475 405 442 L392 542 L329 542 L300 491 L271 542 L208 542Z" fill="#7088cf" stroke="#34467d" stroke-width="8"/><circle cx="300" cy="463" r="7" fill="#fff"/></g>
              <g data-category="accessory" data-item="purse" class="wearable hidden"><path d="M376 315 Q449 345 457 474" fill="none" stroke="#784b84" stroke-width="12"/><rect x="389" y="443" width="111" height="91" rx="22" fill="#c78bd4" stroke="#6b3c77" stroke-width="8"/><circle cx="445" cy="480" r="8" fill="#ffe17a"/></g>
              <g data-category="shoes" data-item="sneakers" class="wearable hidden"><path d="M184 548 Q229 528 283 556 L278 597 L171 597 Q148 572 184 548Z" fill="#fafaff" stroke="#4d4e70" stroke-width="8"/><path d="M416 548 Q371 528 317 556 L322 597 L429 597 Q452 572 416 548Z" fill="#fafaff" stroke="#4d4e70" stroke-width="8"/><path d="M196 563 L267 581 M404 563 L333 581" stroke="#78bfe9" stroke-width="7"/></g>
            </g>

            <g id="panda-wearables" class="wearable-set hidden">
              <g data-category="hat" data-item="sun" class="wearable hidden"><ellipse cx="300" cy="98" rx="137" ry="26" fill="#f8d878" stroke="#6d4b20" stroke-width="8"/><path d="M221 97 Q235 32 300 32 Q365 32 379 97Z" fill="#ffe69b" stroke="#6d4b20" stroke-width="8"/><path d="M235 65 Q300 87 365 65" fill="none" stroke="#e77d91" stroke-width="14"/></g>
              <g data-category="hat" data-item="party" class="wearable hidden"><path d="M239 111 L300 19 L361 111Z" fill="#9d83e8" stroke="#4b3d78" stroke-width="8"/><circle cx="300" cy="18" r="15" fill="#ffd468"/><circle cx="278" cy="65" r="8" fill="#ff91a5"/><circle cx="324" cy="78" r="8" fill="#77c9c3"/></g>
              <g data-category="top" data-item="shirt" class="wearable hidden"><path d="M190 321 Q210 292 245 287 L300 313 L355 287 Q390 292 410 321 L387 456 Q300 484 213 456Z" fill="#78bfe9" stroke="#315b75" stroke-width="8"/><path d="M266 298 Q300 329 334 298" fill="none" stroke="#315b75" stroke-width="8"/></g>
              <g data-category="top" data-item="scarf" class="wearable hidden"><path d="M190 307 Q300 360 410 307 L394 354 Q300 383 206 354Z" fill="#ef8093" stroke="#7f3948" stroke-width="8"/><path d="M344 346 L393 486 L342 469 L311 369Z" fill="#ef8093" stroke="#7f3948" stroke-width="8"/></g>
              <g data-category="bottom" data-item="shorts" class="wearable hidden"><path d="M211 440 Q300 466 389 440 L380 535 L326 535 L300 491 L274 535 L220 535Z" fill="#7088cf" stroke="#34467d" stroke-width="8"/><circle cx="300" cy="458" r="7" fill="#fff"/></g>
              <g data-category="accessory" data-item="purse" class="wearable hidden"><path d="M367 318 Q427 350 435 466" fill="none" stroke="#784b84" stroke-width="12"/><rect x="369" y="438" width="108" height="89" rx="22" fill="#c78bd4" stroke="#6b3c77" stroke-width="8"/><circle cx="423" cy="474" r="8" fill="#ffe17a"/></g>
              <g data-category="shoes" data-item="sneakers" class="wearable hidden"><path d="M200 546 Q238 529 284 554 L282 594 L188 594 Q167 570 200 546Z" fill="#fafaff" stroke="#4d4e70" stroke-width="8"/><path d="M400 546 Q362 529 316 554 L318 594 L412 594 Q433 570 400 546Z" fill="#fafaff" stroke="#4d4e70" stroke-width="8"/><path d="M211 561 L271 577 M389 561 L329 577" stroke="#78bfe9" stroke-width="7"/></g>
            </g>
          </svg>
        </div>
        <p id="outfitMessage">Your capybara is ready to dress up!</p>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
