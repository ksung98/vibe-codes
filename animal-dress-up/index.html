<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Dress-Up</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <a class="home-link" href="../">← Home</a>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Creative Play</p>
      <h1>Animal Dress-Up</h1>
      <p>Choose a cuddly animal and mix and match cute clothes and accessories.</p>
    </header>

    <section class="layout">
      <aside class="controls" aria-label="Dress-up controls">
        <div class="control-group">
          <h2>Choose an animal</h2>
          <div class="choice-row animal-choices">
            <button class="choice active" data-animal="capybara" type="button">Capybara</button>
            <button class="choice" data-animal="panda" type="button">Panda</button>
          </div>
        </div>

        <div class="control-group"><h2>Hat</h2><div class="choice-row">
          <button class="item active" data-category="hat" data-item="none" type="button">None</button>
          <button class="item" data-category="hat" data-item="sun" type="button">Sun hat</button>
          <button class="item" data-category="hat" data-item="party" type="button">Party hat</button>
        </div></div>

        <div class="control-group"><h2>Top</h2><div class="choice-row">
          <button class="item active" data-category="top" data-item="none" type="button">None</button>
          <button class="item" data-category="top" data-item="shirt" type="button">T-shirt</button>
          <button class="item" data-category="top" data-item="scarf" type="button">Scarf</button>
        </div></div>

        <div class="control-group"><h2>Bottom</h2><div class="choice-row">
          <button class="item active" data-category="bottom" data-item="none" type="button">None</button>
          <button class="item" data-category="bottom" data-item="shorts" type="button">Shorts</button>
        </div></div>

        <div class="control-group"><h2>Accessories</h2><div class="choice-row">
          <button class="item active" data-category="accessory" data-item="none" type="button">None</button>
          <button class="item" data-category="accessory" data-item="purse" type="button">Purse</button>
        </div></div>

        <div class="control-group"><h2>Shoes</h2><div class="choice-row">
          <button class="item active" data-category="shoes" data-item="none" type="button">None</button>
          <button class="item" data-category="shoes" data-item="sneakers" type="button">Sneakers</button>
        </div></div>

        <div class="actions">
          <button id="randomButton" type="button">Surprise me</button>
          <button id="resetButton" type="button">Reset outfit</button>
        </div>
      </aside>

      <section class="stage-panel">
        <div class="stage-shell">
          <div id="dressUpStage" class="dress-up-stage animal-capybara" aria-live="polite">
            <img id="animalBase" alt="Dress-up animal" />

            <svg class="wearable-layer" data-animal="capybara" data-category="hat" data-item="sun" viewBox="0 0 520 520"><ellipse cx="260" cy="88" rx="122" ry="22" fill="#ffdf7a" stroke="#6c4d1e" stroke-width="8"/><path d="M185 87 Q197 25 260 25 Q323 25 335 87Z" fill="#ffe9a6" stroke="#6c4d1e" stroke-width="8"/></svg>
            <svg class="wearable-layer" data-animal="capybara" data-category="hat" data-item="party" viewBox="0 0 520 520"><path d="M212 102 L260 22 L308 102Z" fill="#9a82e8" stroke="#4b3d78" stroke-width="8"/><circle cx="260" cy="18" r="14" fill="#ffd767"/></svg>
            <svg class="wearable-layer" data-animal="capybara" data-category="top" data-item="shirt" viewBox="0 0 520 520"><path d="M150 222 Q176 194 213 192 L260 216 L307 192 Q344 194 370 222 L346 362 Q261 395 174 362Z" fill="#7fc3ed" stroke="#315973" stroke-width="8"/></svg>
            <svg class="wearable-layer" data-animal="capybara" data-category="top" data-item="scarf" viewBox="0 0 520 520"><path d="M155 214 Q260 264 365 214 L350 262 Q260 294 170 262Z" fill="#ef7f91" stroke="#7f3946" stroke-width="8"/></svg>
            <svg class="wearable-layer" data-animal="capybara" data-category="bottom" data-item="shorts" viewBox="0 0 520 520"><path d="M166 335 Q260 367 354 335 L344 430 L286 430 L260 384 L234 430 L176 430Z" fill="#6f88cf" stroke="#34467d" stroke-width="8"/></svg>
            <svg class="wearable-layer" data-animal="capybara" data-category="accessory" data-item="purse" viewBox="0 0 520 520"><path d="M312 213 Q376 242 384 360" fill="none" stroke="#7b4c86" stroke-width="12"/><rect x="319" y="336" width="92" height="82" rx="18" fill="#c78bd4" stroke="#6b3c77" stroke-width="8"/></svg>
            <svg class="wearable-layer" data-animal="capybara" data-category="shoes" data-item="sneakers" viewBox="0 0 520 520"><path d="M163 434 Q198 422 235 445 L235 470 L150 470 Q133 453 163 434Z" fill="#f8f9ff" stroke="#505172" stroke-width="8"/><path d="M357 434 Q322 422 285 445 L285 470 L370 470 Q387 453 357 434Z" fill="#f8f9ff" stroke="#505172" stroke-width="8"/></svg>

            <svg class="wearable-layer" data-animal="panda" data-category="hat" data-item="sun" viewBox="0 0 520 520"></svg>
            <svg class="wearable-layer" data-animal="panda" data-category="hat" data-item="party" viewBox="0 0 520 520"></svg>
            <svg class="wearable-layer" data-animal="panda" data-category="top" data-item="shirt" viewBox="0 0 520 520"></svg>
            <svg class="wearable-layer" data-animal="panda" data-category="top" data-item="scarf" viewBox="0 0 520 520"></svg>
            <svg class="wearable-layer" data-animal="panda" data-category="bottom" data-item="shorts" viewBox="0 0 520 520"></svg>
            <svg class="wearable-layer" data-animal="panda" data-category="accessory" data-item="purse" viewBox="0 0 520 520"></svg>
            <svg class="wearable-layer" data-animal="panda" data-category="shoes" data-item="sneakers" viewBox="0 0 520 520"></svg>
          </div>
        </div>
        <p id="outfitMessage">Your capybara is ready to dress up!</p>
      </section>
    </section>
  </main>
  <script src="script.js?v=10"></script>
</body>
</html>
