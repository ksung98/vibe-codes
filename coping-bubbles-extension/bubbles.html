<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coping Bubbles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <section class="calm-card" aria-label="Coping skill instructions">
      <h1>Breathe with the bubbles</h1>
      <p>Focus on one bubble at a time and watch it float on your screen. Focus on breathing by taking a slow breath, then a slow breath out.</p>
      <button id="resetButton" type="button">Refresh bubbles</button>
    </section>

    <div id="bubbleContainer" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
