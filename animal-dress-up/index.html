<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panda Dress-Up</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{padding:0 0 36px;font-family:Arial,Helvetica,sans-serif;color:#352f48;background:linear-gradient(160deg,#fff8ec 0%,#f5efff 50%,#eaf7ff 100%)}
    .home{position:fixed;top:16px;left:16px;z-index:10;display:inline-flex;padding:10px 14px;border:1px solid rgba(91,75,138,.14);border-radius:999px;background:rgba(255,255,255,.94);color:#4b3d78;text-decoration:none;font-weight:800;box-shadow:0 8px 20px rgba(91,75,138,.14)}
    .app{width:min(1180px,calc(100vw - 32px));margin:0 auto;padding-top:78px}
    .hero,.controls,.stage{border:1px solid rgba(136,115,201,.16);background:rgba(255,255,255,.82);box-shadow:0 14px 32px rgba(91,75,138,.12)}
    .hero{margin-bottom:20px;padding:24px;border-radius:28px}.eyebrow{margin:0 0 8px;color:#8873c9;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1,h2,p{margin-top:0}h1{margin-bottom:10px;color:#4b3d78;font-size:clamp(30px,4vw,48px);line-height:1.05}.hero p:last-child{max-width:780px;margin-bottom:0;color:#5c5672;font-size:17px;line-height:1.5}
    .workspace{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}.controls,.stage{border-radius:28px}.controls{display:grid;gap:14px;padding:20px}.controls h2{margin-bottom:0;color:#4b3d78;font-size:23px}.instructions{margin-bottom:4px;color:#6a637c;line-height:1.45}
    button{width:100%;border:0;border-radius:18px;padding:15px 16px;background:#eee8ff;color:#4b3d78;font:inherit;font-weight:800;cursor:pointer;transition:transform 120ms ease,background 150ms ease,box-shadow 150ms ease}button:hover{background:#e1d8ff}button:active{transform:scale(.98)}
    .item{display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:17px}.item::after{content:"Add";padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.7);font-size:12px}.item[aria-pressed="true"]{background:#8873c9;color:#fff;box-shadow:0 8px 18px rgba(136,115,201,.28)}.item[aria-pressed="true"]::after{content:"On";color:#4b3d78}
    .actions{display:grid;gap:10px;margin-top:5px}#surprise{background:#f7cf68;color:#5f4719}#surprise:hover{background:#f2c44c}.secondary{background:#e7f4ee;color:#47735d}
    .stage{padding:20px}.frame{display:grid;place-items:center;min-height:650px;overflow:hidden;border:2px solid rgba(136,115,201,.18);border-radius:25px;background:linear-gradient(180deg,#fffdf8,#f8f3ec)}
    #panda{display:block;width:100%;height:650px;object-fit:contain;opacity:1;transform:scale(1);transition:opacity 110ms ease,transform 110ms ease}#panda.changing{opacity:.2;transform:scale(.985)}#message{margin:16px 0 0;text-align:center;color:#5f5975;font-size:16px;font-weight:700}
    @media(max-width:880px){.workspace{grid-template-columns:1fr}.controls{grid-template-columns:repeat(3,minmax(0,1fr))}.controls h2,.instructions,.actions{grid-column:1/-1}}
    @media(max-width:620px){.app{width:min(100vw - 18px,1180px);padding-top:72px}.home{top:10px;left:10px;padding:8px 11px;font-size:.84rem}.hero,.controls,.stage,.frame{border-radius:20px}.controls{grid-template-columns:1fr}.controls h2,.instructions,.actions{grid-column:auto}.frame{min-height:470px}#panda{height:470px}}
  </style>
</head>
<body>
  <a class="home" href="../">← Home</a>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Creative Play</p>
      <h1>Panda Dress-Up</h1>
      <p>Choose a hat, backpack, and shoes. Every combination displays a complete illustrated panda so each item fits naturally.</p>
    </header>
    <section class="workspace">
      <aside class="controls" aria-label="Panda dress-up controls">
        <h2>Dress the panda</h2>
        <p class="instructions">Tap an item to put it on. Tap it again to take it off.</p>
        <button class="item" data-item="hat" aria-pressed="false" type="button"><span>🧢 Hat</span></button>
        <button class="item" data-item="backpack" aria-pressed="false" type="button"><span>🎒 Backpack</span></button>
        <button class="item" data-item="shoes" aria-pressed="false" type="button"><span>👟 Shoes</span></button>
        <div class="actions">
          <button id="surprise" type="button">Surprise me</button>
          <button id="reset" class="secondary" type="button">Take everything off</button>
        </div>
      </aside>
      <section class="stage" aria-live="polite">
        <div class="frame"><img id="panda" alt="Panda without dress-up items"></div>
        <p id="message">The panda is ready to dress up!</p>
      </section>
    </section>
  </main>

  <script src="states/fixed-none.js?v=3"></script>
  <script src="states/fixed-hat.js?v=3"></script>
  <script src="states/fixed-e.js?v=3"></script>
  <script src="states/fixed-f.js?v=3"></script>
  <script src="states/fixed-g.js?v=3"></script>
  <script>
    const selected={hat:false,backpack:false,shoes:false};
    const panda=document.getElementById('panda');
    const message=document.getElementById('message');
    const buttons=[...document.querySelectorAll('.item')];

    function stateKey(){
      const active=Object.keys(selected).filter(item=>selected[item]);
      if(active.length===0)return 'none';
      if(active.length===3)return 'all';
      return active.join('-');
    }

    function statusText(){
      const active=Object.keys(selected).filter(item=>selected[item]);
      if(active.length===0)return 'The panda is ready to dress up!';
      if(active.length===1)return `The panda is wearing the ${active[0]}!`;
      if(active.length===2)return `The panda is wearing the ${active[0]} and ${active[1]}!`;
      return 'The panda is wearing the hat, backpack, and shoes!';
    }

    function render(firstLoad=false){
      buttons.forEach(button=>button.setAttribute('aria-pressed',String(selected[button.dataset.item])));
      const update=()=>{
        const key=stateKey();
        const source=window.PANDA_STATES&&window.PANDA_STATES[key];
        if(!source){
          message.textContent='That outfit image could not load. Please try another option.';
          panda.classList.remove('changing');
          return;
        }
        panda.src=source;
        panda.alt=statusText();
        message.textContent=statusText();
        panda.classList.remove('changing');
      };
      if(firstLoad)update();else{panda.classList.add('changing');window.setTimeout(update,110)}
    }

    panda.addEventListener('error',()=>{
      Object.keys(selected).forEach(item=>selected[item]=false);
      buttons.forEach(button=>button.setAttribute('aria-pressed','false'));
      panda.src=window.PANDA_STATES.none;
      message.textContent='The outfit image was reset because it could not load.';
      panda.classList.remove('changing');
    });

    Object.values(window.PANDA_STATES||{}).forEach(src=>{const image=new Image();image.src=src});
    buttons.forEach(button=>button.addEventListener('click',()=>{selected[button.dataset.item]=!selected[button.dataset.item];render()}));
    document.getElementById('reset').addEventListener('click',()=>{Object.keys(selected).forEach(item=>selected[item]=false);render()});
    document.getElementById('surprise').addEventListener('click',()=>{
      Object.keys(selected).forEach(item=>selected[item]=Math.random()<.5);
      if(!Object.values(selected).some(Boolean)){const choices=Object.keys(selected);selected[choices[Math.floor(Math.random()*choices.length)]]=true}
      render();
    });
    render(true);
  </script>
</body>
</html>
